project:
  type: book
  output-dir: _site

engines: ['julia']
julia:
  project: "."
  env:
    - "GKSwstype=100"

book:
  title: "Elmfire.jl"
  search:
    location: sidebar
    keyboard-shortcut:
      - "/"
  navbar:
    logo: assets/logo.svg
    logo-href: https://rallypoint1.com
    right:
      - icon: star
        href: https://github.com/RallypointOne/Elmfire.jl/stargazers
        text: "Star"
      - icon: github
        href: https://github.com/RallypointOne/Elmfire.jl
  chapters:
    - part: "Docs"
      chapters:
        - index.qmd
        - getting-started.qmd
        - comparison.qmd
        - gpu.qmd
    - part: "Tutorials"
      chapters:
        - tutorials/index.qmd
        - tutorials/basic-simulation.qmd
        - tutorials/weather-effects.qmd
        - tutorials/terrain-effects.qmd
        - tutorials/crown-fire.qmd
        - tutorials/spotting.qmd
        - tutorials/ensemble.qmd
        - tutorials/wui.qmd
        - tutorials/marshall-fire.qmd
        - tutorials/suppression.qmd
    - part: "Module Reference"
      chapters:
        - reference/index.qmd
        - reference/rothermel.qmd
        - reference/fuel-models.qmd
        - reference/simulation.qmd
        - reference/weather.qmd
        - reference/geospatial.qmd
        - reference/ensemble.qmd
        - reference/wui-suppression.qmd
    - part: "API"
      chapters:
        - pages/api.qmd
    - part: "Resources"
      chapters:
        - pages/benchmarks.qmd
        - pages/changelog.qmd
        - pages/coverage.qmd

  page-footer:
    center: "Built on __BUILD_DATE__"

language:
  search-text-placeholder: "Search  (/)"

format:
  html:
    css: assets/styles.css
    number-sections: false
    theme:
      - flatly
      - assets/theme.scss
    include-after-body:
      - file: assets/_version-selector.html
